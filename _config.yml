highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
environment: prod
url: "https://alanewing.github.io"
baseurl: ""

markdown: kramdown
kramdown:
  math_engine: katex

plugins:
-   jekyll-scholar
-   jekyll-sitemap
-   jekyll-feed
-   jekyll-katex

katex:
  js_path: "assets"  
  rendering_options:
    throw_error: false      
    error_color: "#cc0000"  

scholar:
  style: apa
  locale: en
  sort_by: year, month
  order: descending
  source: ./_bibliography
  bibliography: references.bib
  bibliography_template: bib
